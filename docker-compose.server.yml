services:
  postgres:
    image: ${OPCV2_POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16-alpine}
    container_name: opcv2-server-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opcv2}
      POSTGRES_USER: ${POSTGRES_USER:-opcv2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opcv2-change-me}
    ports:
      - "127.0.0.1:${OPCV2_POSTGRES_PORT:-5433}:5432"
    volumes:
      - opcv2_postgres_server_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opcv2} -d ${POSTGRES_DB:-opcv2}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: ${OPCV2_REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    container_name: opcv2-server-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPCV2_REDIS_PORT:-6391}:6379"
    volumes:
      - opcv2_redis_server_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      args:
        APP: api
        GO_BUILDER_IMAGE: ${OPCV2_GO_BUILDER_IMAGE:-docker.m.daocloud.io/library/golang:1.22.3-alpine}
        RUNTIME_IMAGE: ${OPCV2_RUNTIME_IMAGE:-docker.m.daocloud.io/library/alpine:3.20}
        GOPROXY: ${OPCV2_GOPROXY:-https://goproxy.cn,direct}
        ALPINE_REPOSITORY: ${OPCV2_ALPINE_REPOSITORY:-https://mirrors.aliyun.com/alpine}
    image: opcv2-server-api:latest
    container_name: opcv2-server-api
    restart: unless-stopped
    environment:
      OPCV2_ENV: ${OPCV2_ENV:-development}
      OPCV2_HTTP_ADDR: :8080
      OPCV2_DATABASE_URL: postgres://${POSTGRES_USER:-opcv2}:${POSTGRES_PASSWORD:-opcv2-change-me}@postgres:5432/${POSTGRES_DB:-opcv2}?sslmode=disable
      OPCV2_REDIS_ADDR: redis:6379
      OPCV2_JWT_SECRET: ${OPCV2_JWT_SECRET:-change-me-in-production}
      OPCV2_SMS_PROVIDER: ${OPCV2_SMS_PROVIDER:-disabled}
      OPCV2_SMS_DEV_CODE: ${OPCV2_SMS_DEV_CODE:-246810}
      OPCV2_AI_PROVIDER: ${OPCV2_AI_PROVIDER:-development}
      OPCV2_AI_MODEL: ${OPCV2_AI_MODEL:-development-model}
      OPCV2_AI_API_KEY: ${OPCV2_AI_API_KEY:-}
      OPCV2_AI_BASE_URL: ${OPCV2_AI_BASE_URL:-}
      OPCV2_AI_TIMEOUT_SECONDS: ${OPCV2_AI_TIMEOUT_SECONDS:-30}
      OPCV2_AI_MODEL_ROUTES: ${OPCV2_AI_MODEL_ROUTES:-}
      OPCV2_DEEPSEEK_API_KEY: ${OPCV2_DEEPSEEK_API_KEY:-}
      OPCV2_OPENAI_API_KEY: ${OPCV2_OPENAI_API_KEY:-}
      OPCV2_LEAD_PROVIDER: ${OPCV2_LEAD_PROVIDER:-development}
      OPCV2_TYC_API_KEY: ${OPCV2_TYC_API_KEY:-}
      OPCV2_TYC_BASE_URL: ${OPCV2_TYC_BASE_URL:-}
      OPCV2_TYC_TIMEOUT_SECONDS: ${OPCV2_TYC_TIMEOUT_SECONDS:-10}
      OPCV2_SERPER_API_KEY: ${OPCV2_SERPER_API_KEY:-}
      OPCV2_SERPER_BASE_URL: ${OPCV2_SERPER_BASE_URL:-}
      OPCV2_SERPER_TIMEOUT_SECONDS: ${OPCV2_SERPER_TIMEOUT_SECONDS:-10}
      OPCV2_SERPAPI_API_KEY: ${OPCV2_SERPAPI_API_KEY:-}
      OPCV2_COMPETITOR_SCANNER_PROVIDER: ${OPCV2_COMPETITOR_SCANNER_PROVIDER:-}
      OPCV2_PROJECT_FILE_PROVIDER: ${OPCV2_PROJECT_FILE_PROVIDER:-development}
      OPCV2_PROJECT_FILE_STORAGE_PATH: ${OPCV2_PROJECT_FILE_STORAGE_PATH:-data/project-match-files}
      OPCV2_PROJECT_RETRIEVAL_PROVIDER: ${OPCV2_PROJECT_RETRIEVAL_PROVIDER:-development}
      OPCV2_PROJECT_RESEARCH_PROVIDER: ${OPCV2_PROJECT_RESEARCH_PROVIDER:-development}
      OPCV2_AUTO_MIGRATE: ${OPCV2_AUTO_MIGRATE:-true}
      OPCV2_MIGRATIONS_PATH: ${OPCV2_MIGRATIONS_PATH:-migrations}
      OPCV2_CORS_ALLOWED_ORIGINS: ${OPCV2_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      OPCV2_EXPENSIVE_ENDPOINT_LIMIT: ${OPCV2_EXPENSIVE_ENDPOINT_LIMIT:-20}
      OPCV2_FEATURE_PAYWALL_ENABLED: ${OPCV2_FEATURE_PAYWALL_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - opcv2_file_storage:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health/ready >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: .
      args:
        APP: worker
        GO_BUILDER_IMAGE: ${OPCV2_GO_BUILDER_IMAGE:-docker.m.daocloud.io/library/golang:1.22.3-alpine}
        RUNTIME_IMAGE: ${OPCV2_RUNTIME_IMAGE:-docker.m.daocloud.io/library/alpine:3.20}
        GOPROXY: ${OPCV2_GOPROXY:-https://goproxy.cn,direct}
        ALPINE_REPOSITORY: ${OPCV2_ALPINE_REPOSITORY:-https://mirrors.aliyun.com/alpine}
    image: opcv2-server-worker:latest
    container_name: opcv2-server-worker
    restart: unless-stopped
    environment:
      OPCV2_ENV: ${OPCV2_ENV:-development}
      OPCV2_DATABASE_URL: postgres://${POSTGRES_USER:-opcv2}:${POSTGRES_PASSWORD:-opcv2-change-me}@postgres:5432/${POSTGRES_DB:-opcv2}?sslmode=disable
      OPCV2_REDIS_ADDR: redis:6379
      OPCV2_AI_PROVIDER: ${OPCV2_AI_PROVIDER:-development}
      OPCV2_AI_MODEL: ${OPCV2_AI_MODEL:-development-model}
      OPCV2_AI_API_KEY: ${OPCV2_AI_API_KEY:-}
      OPCV2_AI_BASE_URL: ${OPCV2_AI_BASE_URL:-}
      OPCV2_AI_TIMEOUT_SECONDS: ${OPCV2_AI_TIMEOUT_SECONDS:-30}
      OPCV2_AI_MODEL_ROUTES: ${OPCV2_AI_MODEL_ROUTES:-}
      OPCV2_DEEPSEEK_API_KEY: ${OPCV2_DEEPSEEK_API_KEY:-}
      OPCV2_OPENAI_API_KEY: ${OPCV2_OPENAI_API_KEY:-}
      OPCV2_LEAD_PROVIDER: ${OPCV2_LEAD_PROVIDER:-development}
      OPCV2_COMPETITOR_SCANNER_PROVIDER: ${OPCV2_COMPETITOR_SCANNER_PROVIDER:-}
      OPCV2_PROJECT_FILE_PROVIDER: ${OPCV2_PROJECT_FILE_PROVIDER:-development}
      OPCV2_PROJECT_FILE_STORAGE_PATH: ${OPCV2_PROJECT_FILE_STORAGE_PATH:-data/project-match-files}
      OPCV2_PROJECT_RETRIEVAL_PROVIDER: ${OPCV2_PROJECT_RETRIEVAL_PROVIDER:-development}
      OPCV2_PROJECT_RESEARCH_PROVIDER: ${OPCV2_PROJECT_RESEARCH_PROVIDER:-development}
      OPCV2_TYC_API_KEY: ${OPCV2_TYC_API_KEY:-}
      OPCV2_TYC_BASE_URL: ${OPCV2_TYC_BASE_URL:-}
      OPCV2_TYC_TIMEOUT_SECONDS: ${OPCV2_TYC_TIMEOUT_SECONDS:-10}
      OPCV2_SERPER_API_KEY: ${OPCV2_SERPER_API_KEY:-}
      OPCV2_SERPER_BASE_URL: ${OPCV2_SERPER_BASE_URL:-}
      OPCV2_SERPER_TIMEOUT_SECONDS: ${OPCV2_SERPER_TIMEOUT_SECONDS:-10}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - opcv2_file_storage:/app/data

  web:
    build:
      context: ./apps/web
      args:
        NODE_BUILDER_IMAGE: ${OPCV2_NODE_BUILDER_IMAGE:-docker.m.daocloud.io/library/node:22-alpine}
        NGINX_IMAGE: ${OPCV2_NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
        NPM_CONFIG_REGISTRY: ${OPCV2_NPM_REGISTRY:-https://registry.npmmirror.com}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: opcv2-server-web:latest
    container_name: opcv2-server-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${OPCV2_WEB_PORT:-8681}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/health/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  opcv2_postgres_server_data:
  opcv2_redis_server_data:
  opcv2_file_storage:
