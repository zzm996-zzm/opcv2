services:
  postgres:
    image: postgres:16-alpine
    container_name: opcv2-server-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opcv2}
      POSTGRES_USER: ${POSTGRES_USER:-opcv2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opcv2-change-me}
    ports:
      - "${OPCV2_POSTGRES_PORT:-5433}:5432"
    volumes:
      - opcv2_postgres_server_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opcv2} -d ${POSTGRES_DB:-opcv2}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: opcv2-server-redis
    restart: unless-stopped
    ports:
      - "${OPCV2_REDIS_PORT:-6391}:6379"
    volumes:
      - opcv2_redis_server_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      args:
        APP: api
    image: opcv2-server-api:latest
    container_name: opcv2-server-api
    restart: unless-stopped
    environment:
      OPCV2_ENV: ${OPCV2_ENV:-development}
      OPCV2_HTTP_ADDR: :8080
      OPCV2_DATABASE_URL: postgres://${POSTGRES_USER:-opcv2}:${POSTGRES_PASSWORD:-opcv2-change-me}@postgres:5432/${POSTGRES_DB:-opcv2}?sslmode=disable
      OPCV2_REDIS_ADDR: redis:6379
      OPCV2_JWT_SECRET: ${OPCV2_JWT_SECRET:-change-me-in-production}
      OPCV2_SMS_PROVIDER: ${OPCV2_SMS_PROVIDER:-disabled}
      OPCV2_SMS_DEV_CODE: ${OPCV2_SMS_DEV_CODE:-246810}
      OPCV2_TYC_API_KEY: ${OPCV2_TYC_API_KEY:-}
      OPCV2_SERPER_API_KEY: ${OPCV2_SERPER_API_KEY:-}
      OPCV2_SERPAPI_API_KEY: ${OPCV2_SERPAPI_API_KEY:-}
      OPCV2_AUTO_MIGRATE: ${OPCV2_AUTO_MIGRATE:-true}
      OPCV2_MIGRATIONS_PATH: ${OPCV2_MIGRATIONS_PATH:-migrations}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health/ready >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: .
      args:
        APP: worker
    image: opcv2-server-worker:latest
    container_name: opcv2-server-worker
    restart: unless-stopped
    environment:
      OPCV2_ENV: ${OPCV2_ENV:-development}
      OPCV2_DATABASE_URL: postgres://${POSTGRES_USER:-opcv2}:${POSTGRES_PASSWORD:-opcv2-change-me}@postgres:5432/${POSTGRES_DB:-opcv2}?sslmode=disable
      OPCV2_REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    image: opcv2-server-web:latest
    container_name: opcv2-server-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${OPCV2_WEB_PORT:-8681}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  opcv2_postgres_server_data:
  opcv2_redis_server_data:
