services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opcv2}
      POSTGRES_USER: ${POSTGRES_USER:-opcv2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opcv2}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opcv2} -d ${POSTGRES_DB:-opcv2}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://${POSTGRES_USER:-opcv2}:${POSTGRES_PASSWORD:-opcv2}@postgres:5432/${POSTGRES_DB:-opcv2}?sslmode=disable",
        "up"
      ]
    restart: "no"

  api:
    build:
      context: .
      args:
        APP: api
    environment:
      OPCV2_ENV: ${OPCV2_ENV:-development}
      OPCV2_HTTP_ADDR: :8080
      OPCV2_DATABASE_URL: postgres://${POSTGRES_USER:-opcv2}:${POSTGRES_PASSWORD:-opcv2}@postgres:5432/${POSTGRES_DB:-opcv2}?sslmode=disable
      OPCV2_REDIS_ADDR: redis:6379
      OPCV2_JWT_SECRET: ${OPCV2_JWT_SECRET:-development-only-change-me}
      OPCV2_SMS_PROVIDER: ${OPCV2_SMS_PROVIDER:-development}
      OPCV2_SMS_DEV_CODE: ${OPCV2_SMS_DEV_CODE:-246810}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      args:
        APP: worker
    environment:
      OPCV2_ENV: ${OPCV2_ENV:-development}
      OPCV2_DATABASE_URL: postgres://${POSTGRES_USER:-opcv2}:${POSTGRES_PASSWORD:-opcv2}@postgres:5432/${POSTGRES_DB:-opcv2}?sslmode=disable
      OPCV2_REDIS_ADDR: redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
